name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            DATE_STR=$(date -u +%Y%m%d)
            echo "tag=build-${DATE_STR}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            wails_platform: windows/amd64
            wails_tags: ""
          - os: macos-latest
            platform: macos
            wails_platform: darwin/universal
            wails_tags: ""
          - os: ubuntu-latest
            platform: linux
            wails_platform: linux/amd64
            wails_tags: "webkit2_41"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: wailsapp/frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Run Go tests
        run: go test ./...

      - name: Build Wails desktop app
        working-directory: wailsapp
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ matrix.wails_tags }}" ]; then
            EXTRA_ARGS="-tags ${{ matrix.wails_tags }}"
          fi
          wails build -clean -platform "${{ matrix.wails_platform }}" -ldflags "-X cloudshelf/internal/version.Version=${{ needs.prepare.outputs.tag }}" ${EXTRA_ARGS}

      - name: Package Wails desktop artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" == "windows" ]; then
            cp wailsapp/build/bin/cloudshelf.exe dist/cloudshelf-windows-amd64.exe
          elif [ "${{ matrix.platform }}" == "macos" ]; then
            ditto -c -k --keepParent wailsapp/build/bin/cloudshelf.app dist/cloudshelf-macos-universal.zip
          else
            tar -czf dist/cloudshelf-linux-amd64.tar.gz -C wailsapp/build/bin cloudshelf
          fi

      - name: Build CLI binaries
        shell: bash
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X cloudshelf/internal/version.Version=${{ needs.prepare.outputs.tag }}"
          if [ "${{ matrix.platform }}" == "windows" ]; then
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/cloudshelf-cli-windows-amd64.exe ./cmd/cli
          elif [ "${{ matrix.platform }}" == "macos" ]; then
            CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/cloudshelf-cli-darwin-amd64 ./cmd/cli
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/cloudshelf-cli-darwin-arm64 ./cmd/cli
          else
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/cloudshelf-cli-linux-amd64 ./cmd/cli
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/cloudshelf-cli-linux-arm64 ./cmd/cli
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: artifacts/*
